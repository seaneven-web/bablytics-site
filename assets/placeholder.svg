  <text x="720" y="560" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" letter-spacing="6" fill="#6f2130" fill-opacity=".8">SCREENSHOT PENDING</text>
  <text x="720" y="604" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#745c3f">captured from the live app at 1440 × 900</text>
