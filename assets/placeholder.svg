  <rect x="1" y="1" width="1438" height="898" fill="none" stroke="#6f2130" stroke-opacity=".35" stroke-width="2" stroke-dasharray="10 8"/>
  <g fill="none" stroke="#6f2130" stroke-opacity=".55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="translate(640 330) scale(2.5)">
    <rect x="6" y="12" width="52" height="40" rx="4"/>
